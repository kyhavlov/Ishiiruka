name: Upload Latest Artifacts to Release

on:
  release:
    types: [released]

jobs:
  package:
    # Tester releases attach their verified, named assets explicitly.
    if: ${{ !startsWith(github.event.release.tag_name, 'bot-doubles-') }}
    name: Release New Slippi Dolphin
    runs-on: ubuntu-latest
    steps:
      - name: Get version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - name: Find the successful build for this release commit
        id: build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow pr-build.yml --commit "$commit" --status success --json databaseId --jq '.[0].databaseId // empty')
          test -n "$run_id" || { echo "No successful build for $commit" >&2; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Download release-commit artifacts
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: pr-build.yml
          run_id: ${{ steps.build.outputs.run_id }}
      - name: Organize release files"
        run: |
          rm -rf *playback*
          find ./ -mindepth 2 -type f -exec mv -t ./ -i '{}' +
          find . -type d -empty -delete
          unzip *linux* && rm -rf Sys && mv *linux* "FM-Slippi-${{ env.VERSION }}-Linux.zip"
          mv *.dmg "FM-Slippi-${{ env.VERSION }}-Mac.dmg"
          mv *windows* "FM-Slippi-${{ env.VERSION }}-Win.zip"
      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./*
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true
